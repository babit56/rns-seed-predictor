[package]
name = "rnssp"
version = "0.2.1"
edition = "2024"
authors = ["babit"]
repository = "https://github.com/babit56/rns-seed-predictor"
license = "MIT"
readme = "README.md"
description = "Library for predicting runs in Rabbit & Steel from seeds and other parameters"

[dependencies]
gamemaker-rand = "0.1.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
serde_support = ["dep:serde"]
